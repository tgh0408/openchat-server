server:
  port: 99
  ssl:
    enabled: true
    certificate: /ssl/tgh666.cn.crt
    certificate-private-key: /ssl/tgh666.cn.key

spring:
  application:
    name: openchat-gateway

  cloud:
    nacos:
      discovery:
        graceful-shutdown-wait-time: 1000
        namespace: 438db0b7-71fa-436c-959d-7fb5069ba31c

    gateway:
      server:
        webflux:
          routes:
            - id: openchat-server
              uri: lb://openchat-server
              predicates:
                - Path=/capi/**

            - id: minio
              uri: http://192.168.2.40:9000
              predicates:
                - Path=/openchat/**
              filters:
                - PreserveHostHeader

# 启用 Actuator 端点，用于排查路由是否正确加载
management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
  endpoint:
    gateway:
      access: unrestricted
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
    reactor.netty.http.client: DEBUG
    # 如果你用的是 WebFlux，不需要 DispatcherServlet，可以删掉下面这行
    # org.springframework.web.servlet.DispatcherServlet: INFO