spring.application.name=openchat-gateway

# 显式读取网关主配置，Data ID 为 openchat-gateway.yml。
spring.config.import=nacos:openchat-gateway.yml?group=DEFAULT_GROUP&refreshEnabled=true

# NACOS_ADDRESS / NACOS_USER / NACOS_PASSWORD：Nacos 地址、用户名和密码。
spring.cloud.nacos.config.server-addr=${NACOS_ADDRESS}
spring.cloud.nacos.config.username=${NACOS_USER}
spring.cloud.nacos.config.password=${NACOS_PASSWORD}
# NACOS_CONFIG_NAMESPACE：存放 openchat-gateway.yml 的配置命名空间 ID。
spring.cloud.nacos.config.namespace=${NACOS_CONFIG_NAMESPACE}
spring.cloud.nacos.config.group=DEFAULT_GROUP
spring.cloud.nacos.config.enabled=true

spring.cloud.nacos.discovery.server-addr=${NACOS_ADDRESS}
spring.cloud.nacos.discovery.service=openchat-gateway
spring.cloud.nacos.discovery.username=${NACOS_USER}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD}
# GATEWAY_DISCOVERY_IP：其他服务可访问的网关 IP，避免注册 Docker 内部地址。
spring.cloud.nacos.discovery.ip=${GATEWAY_DISCOVERY_IP}
spring.cloud.nacos.discovery.graceful-shutdown-wait-time=1000
