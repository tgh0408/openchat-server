server:
  port: 99
  ssl:
    enabled: true
    bundle: gateway

spring:
  application:
    name: openchat-gateway
  ssl:
    bundle:
      pem:
        gateway:
          # 续期工具更新下列文件后，网关自动重新加载证书。
          reload-on-update: true
          keystore:
            # 证书文件应包含完整证书链，且与私钥匹配。
            certificate: file:/ssl/***.crt
            private-key: file:/ssl/***.key
      watch:
        file:
          # 等待文件变更稳定，续期时应成对更新证书与私钥。
          quiet-period: 5s

  cloud:
    nacos:
      discovery:
        graceful-shutdown-wait-time: 1000
        namespace: 438db0b7-71fa-436c-959d-7fb5069ba31c
    gateway:
      server:
        webflux:
          routes:
            - id: openchat-server
              uri: lb://openchat-server
              predicates:
                - Path=/capi/**

            - id: minio
              uri: http://192.168.2.40:9000
              predicates:
                - Path=/openchat/**
              filters:
                - PreserveHostHeader

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: INFO
    org.springframework.cloud.gateway: INFO